<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order - Shipping Form</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .form-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .form-header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .form-body {
            padding: 40px;
        }

        .form-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background: #f9f9f9;
        }

        .section-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group.full-width {
            flex: 100%;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        .required {
            color: #e74c3c;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .phone-verification {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .phone-verification .form-group {
            flex: 2;
        }

        .otp-section {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #e8f5e8;
            border-radius: 8px;
        }

        .otp-section.show {
            display: block;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .submit-btn {
            width: 100%;
            font-size: 18px;
            padding: 15px;
            margin-top: 30px;
        }

        .verification-status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-weight: 600;
        }

        .verification-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .verification-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
            
            .phone-verification {
                flex-direction: column;
                align-items: stretch;
            }
            
            .container {
                margin: 10px;
                border-radius: 10px;
            }
            
            .form-body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-header">
            <h1><i class="fas fa-shipping-fast"></i> Place Your Order</h1>
            <p>Fill out the form below to create your shipping order</p>
        </div>

        <div class="form-body">
            <form id="shippingForm" action="/place-order" method="POST" enctype="multipart/form-data">
                
                <!-- Customer Information Section -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-user"></i> Customer Information
                    </h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="customer_name">Full Name <span class="required">*</span></label>
                            <input type="text" id="customer_name" name="customer_name" required>
                        </div>
                        <div class="form-group">
                            <label for="customer_email">Email Address <span class="required">*</span></label>
                            <input type="email" id="customer_email" name="customer_email" required>
                        </div>
                    </div>

                    <div class="phone-verification">
                        <div class="form-group">
                            <label for="customer_phone">Phone Number <span class="required">*</span></label>
                            <input type="tel" id="customer_phone" name="customer_phone" 
                                   pattern="[6-9][0-9]{9}" placeholder="Enter 10-digit mobile number" required>
                        </div>
                        <button type="button" id="sendOtpBtn" class="btn btn-secondary">
                            <i class="fas fa-sms"></i> Send OTP
                        </button>
                    </div>

                    <div id="otpSection" class="otp-section">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="otp_input">Enter OTP</label>
                                <input type="text" id="otp_input" placeholder="Enter 6-digit OTP">
                            </div>
                            <div class="form-group">
                                <button type="button" id="verifyOtpBtn" class="btn btn-success">
                                    <i class="fas fa-check"></i> Verify OTP
                                </button>
                            </div>
                        </div>
                        <div id="verificationStatus" class="verification-status" style="display: none;"></div>
                    </div>
                </div>

                <!-- Pickup Address Section -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-map-marker-alt"></i> Pickup Address
                    </h3>
                    
                    <div class="form-group full-width">
                        <label for="pickup_address_line">Address Line <span class="required">*</span></label>
                        <textarea id="pickup_address_line" name="pickup_address_line" 
                                placeholder="Enter complete pickup address" required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="pickup_district">District <span class="required">*</span></label>
                            <input type="text" id="pickup_district" name="pickup_district" required>
                        </div>
                        <div class="form-group">
                            <label for="pickup_state">State <span class="required">*</span></label>
                            <input type="text" id="pickup_state" name="pickup_state" required>
                        </div>
                        <div class="form-group">
                            <label for="pickup_pincode">Pincode <span class="required">*</span></label>
                            <input type="text" id="pickup_pincode" name="pickup_pincode" 
                                   pattern="[0-9]{6}" placeholder="6-digit pincode" required>
                        </div>
                    </div>
                </div>

                <!-- Delivery Address Section -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-truck"></i> Delivery Address
                    </h3>
                    
                    <div class="form-group full-width">
                        <label for="delivery_address_line">Address Line <span class="required">*</span></label>
                        <textarea id="delivery_address_line" name="delivery_address_line" 
                                placeholder="Enter complete delivery address" required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="delivery_district">District <span class="required">*</span></label>
                            <input type="text" id="delivery_district" name="delivery_district" required>
                        </div>
                        <div class="form-group">
                            <label for="delivery_state">State <span class="required">*</span></label>
                            <input type="text" id="delivery_state" name="delivery_state" required>
                        </div>
                        <div class="form-group">
                            <label for="delivery_pincode">Pincode <span class="required">*</span></label>
                            <input type="text" id="delivery_pincode" name="delivery_pincode" 
                                   pattern="[0-9]{6}" placeholder="6-digit pincode" required>
                        </div>
                    </div>
                </div>

                <!-- Package Details Section -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-box"></i> Package Details
                    </h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="zone_id">Zone ID <span class="required">*</span></label>
                            <input type="text" id="zone_id" name="zone_id" required>
                        </div>
                        <div class="form-group">
                            <label for="package_type">Package Type <span class="required">*</span></label>
                            <select id="package_type" name="package_type" required>
                                <option value="">Select Package Type</option>
                                <option value="documents">Documents</option>
                                <option value="electronics">Electronics</option>
                                <option value="clothing">Clothing</option>
                                <option value="books">Books</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="weight">Weight (kg) <span class="required">*</span></label>
                            <input type="number" id="weight" name="weight" step="0.1" min="0.1" required>
                        </div>
                        <div class="form-group">
                            <label for="length">Length (cm) <span class="required">*</span></label>
                            <input type="number" id="length" name="length" step="0.1" min="1" required>
                        </div>
                        <div class="form-group">
                            <label for="width">Width (cm) <span class="required">*</span></label>
                            <input type="number" id="width" name="width" step="0.1" min="1" required>
                        </div>
                        <div class="form-group">
                            <label for="height">Height (cm) <span class="required">*</span></label>
                            <input type="number" id="height" name="height" step="0.1" min="1" required>
                        </div>
                    </div>
                </div>

                <!-- Payment and Additional Details Section -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-credit-card"></i> Payment & Additional Details
                    </h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="payment_mode">Payment Mode <span class="required">*</span></label>
                            <select id="payment_mode" name="payment_mode" required>
                                <option value="">Select Payment Mode</option>
                                <option value="prepaid">Prepaid</option>
                                <option value="cod">Cash on Delivery</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="gst_bill">GST Bill (PDF only)</label>
                            <input type="file" id="gst_bill" name="gst_bill" accept=".pdf">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="recipient_name">Recipient Name <span class="required">*</span></label>
                            <input type="text" id="recipient_name" name="recipient_name" required>
                        </div>
                        <div class="form-group">
                            <label for="recipient_phone">Recipient Phone <span class="required">*</span></label>
                            <input type="tel" id="recipient_phone" name="recipient_phone" 
                                   pattern="[6-9][0-9]{9}" placeholder="10-digit mobile number" required>
                        </div>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary submit-btn" disabled>
                    <i class="fas fa-paper-plane"></i> Place Order
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "your-api-key",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "your-sender-id",
            appId: "your-app-id"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        // Global variables
        let phoneVerified = false;
        let verificationId = null;

        // Form validation function
        function checkFormCompletion() {
            console.log('Checking form completion...');
            
            const requiredFields = [
                'customer_name', 'customer_email', 'customer_phone', 
                'pickup_address_line', 'pickup_district', 'pickup_state', 'pickup_pincode',
                'delivery_address_line', 'delivery_state', 'delivery_district', 'delivery_pincode',
                'zone_id', 'package_type', 'weight', 'length', 'width', 'height', 
                'payment_mode', 'recipient_name', 'recipient_phone'
            ];
            
            let allFilled = true;
            let missingFields = [];
            
            requiredFields.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                if (field && !field.value.trim()) {
                    allFilled = false;
                    missingFields.push(fieldId);
                }
            });
            
            // Phone verification check
            if (!phoneVerified) {
                allFilled = false;
                missingFields.push('phone_verification');
            }
            
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.disabled = !allFilled;
                console.log('Submit button enabled:', allFilled);
                if (!allFilled) {
                    console.log('Missing required fields:', missingFields);
                }
            }
        }

        // Phone OTP functionality
        document.getElementById('sendOtpBtn').onclick = async function() {
            const phoneNumber = document.getElementById('customer_phone').value;
            
            if (!phoneNumber.match(/^[6-9]\d{9}$/)) {
                alert('Enter a valid 10-digit Indian mobile number.');
                return;
            }
            
            const appVerifier = new firebase.auth.RecaptchaVerifier('sendOtpBtn', {
                'size': 'invisible',
                'callback': function(response) {
                    console.log('reCAPTCHA verified');
                }
            });
            
            try {
                this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
                this.disabled = true;
                
                const confirmationResult = await firebase.auth()
                    .signInWithPhoneNumber('+91' + phoneNumber, appVerifier);
                
                verificationId = confirmationResult.verificationId;
                
                document.getElementById('otpSection').classList.add('show');
                this.innerHTML = '<i class="fas fa-check"></i> OTP Sent';
                this.style.background = '#28a745';
                
                console.log('OTP sent successfully');
            } catch (error) {
                console.error('Error sending OTP:', error);
                alert('Error sending OTP: ' + error.message);
                
                this.innerHTML = '<i class="fas fa-sms"></i> Send OTP';
                this.disabled = false;
            }
        };

        // Verify OTP functionality
        document.getElementById('verifyOtpBtn').onclick = async function() {
            const otp = document.getElementById('otp_input').value;
            const statusDiv = document.getElementById('verificationStatus');
            
            if (!otp || otp.length !== 6) {
                alert('Please enter a valid 6-digit OTP');
                return;
            }
            
            try {
                this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
                this.disabled = true;
                
                const credential = firebase.auth.PhoneAuthProvider.credential(verificationId, otp);
                await firebase.auth().signInWithCredential(credential);
                
                phoneVerified = true;
                statusDiv.innerHTML = '<i class="fas fa-check-circle"></i> Phone number verified successfully!';
                statusDiv.className = 'verification-status verification-success';
                statusDiv.style.display = 'block';
                
                this.innerHTML = '<i class="fas fa-check"></i> Verified';
                this.style.background = '#28a745';
                
                checkFormCompletion();
                console.log('Phone verification successful');
                
            } catch (error) {
                console.error('Error verifying OTP:', error);
                statusDiv.innerHTML = '<i class="fas fa-times-circle"></i> Invalid OTP. Please try again.';
                statusDiv.className = 'verification-status verification-error';
                statusDiv.style.display = 'block';
                
                this.innerHTML = '<i class="fas fa-check"></i> Verify OTP';
                this.disabled = false;
            }
        };

        // Form submission handler
        document.getElementById('shippingForm').addEventListener('submit', function(e) {
            const submitBtn = document.getElementById('submitBtn');
            
            if (!phoneVerified) {
                e.preventDefault();
                alert('Please verify your phone number before submitting the form.');
                return false;
            }
            
            if (submitBtn) {
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
                submitBtn.disabled = true;
            }
            
            console.log('Form submitted successfully');
            return true;
        });

        // Add event listeners to all form fields for real-time validation
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('shippingForm');
            const inputs = form.querySelectorAll('input, select, textarea');
            
            inputs.forEach(input => {
                input.addEventListener('input', checkFormCompletion);
                input.addEventListener('change', checkFormCompletion);
            });
            
            // Initial form check
            checkFormCompletion();
        });

        // Debug function to force enable submit (for testing)
        function forceEnableSubmit() {
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.disabled = false;
                phoneVerified = true;
                console.log('Submit button force-enabled for testing');
            }
        }

        // Expose debug function to global scope
        window.forceEnableSubmit = forceEnableSubmit;
    </script>
</body>
</html>
